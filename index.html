<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI 看板">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn-icons-png.flaticon.com; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2534/2534433.png">
<title>AI LLM 投資看板</title>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/lib/marked.umd.js" integrity="sha384-fGlgqlm/GUgiVEyV6lvBJbxjprBPT1g0VoE9o/FjCWntEwOQYGqANQdFeFlqbObP" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js" integrity="sha384-P0JNneQf81HOl9VwNXK76cQ9VMD6Nfsnepxb0cCOg8+UzEdzgPHAPV4wVQrvYQSx" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; }
  :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); --bg-body: #f1f5f9; --bg-card: #ffffff; --text-main: #0f172a; --text-sub: #64748b; --line: #e2e8f0; }
  body { margin: 0; background: var(--bg-body); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", Roboto, sans-serif; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  .app { max-width: 800px; margin: 40px auto; background: var(--bg-card); border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,.15); border: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; }
  .header { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); padding: calc(32px + var(--safe-top)) 32px 28px; color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .header h1 { font-size: 26px; font-weight: 900; letter-spacing: .5px; margin: 0; }
  .header-sub { font-size: 12px; color: #94a3b8; margin-top: 6px; font-weight: 600; }
  .live { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 10px; font-size: 11px; font-weight: 900; letter-spacing: 1px; background: rgba(34,197,94,.2); color: #4ade80; flex-shrink: 0; }
  .live .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.5s infinite; }
  .live.stale { background: rgba(148,163,184,.2); color: #cbd5e1; } .live.stale .dot { animation: none; }
  .notice { margin: 16px 32px 0; padding: 10px 14px; border-radius: 12px; background: #fffbeb; border: 1px solid #fde68a; color: #92400e; font-size: 12px; font-weight: 700; }
  .section { padding: 24px 32px; border-bottom: 1px solid #f1f5f9; }
  .section-bg { background: #f8fafc; }
  .section-title { font-size: 13px; font-weight: 900; color: var(--text-sub); letter-spacing: 1px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .chip { font-size: 10px; padding: 4px 8px; border-radius: 6px; font-weight: 800; white-space: nowrap; }
  .alloc-bar { display: flex; height: 14px; border-radius: 8px; overflow: hidden; margin-bottom: 14px; background: var(--line); }
  .alloc-bar > div { transition: width .5s ease; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: #475569; background: #f1f5f9; border: 1px solid var(--line); padding: 4px 10px; border-radius: 8px; }
  .legend-item i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .legend-item b { color: #0f172a; font-family: ui-monospace, monospace; font-size: 12px; }
  .holdings { display: flex; flex-wrap: wrap; gap: 10px; }
  .holding { display: inline-flex; align-items: center; gap: 6px; background: #fff; color: var(--text-main); border: 1px solid var(--line); padding: 10px 16px; border-radius: 12px; font-size: 15px; font-weight: 800; text-decoration: none; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .holding:active { transform: scale(.96); }
  .up { color: #16a34a; } .down { color: #dc2626; } .flat { color: #94a3b8; }
  .holding small { font-size: 12px; }
  .video { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: linear-gradient(to right, #fef2f2, #fff); border-left: 4px solid #ef4444; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .video .sym { font-size: 18px; font-weight: 900; color: #7f1d1d; letter-spacing: 1px; }
  .video .date { font-size: 12px; color: #f87171; font-weight: 700; font-family: ui-monospace, monospace; }
  .play { background: #ef4444; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 800; text-decoration: none; white-space: nowrap; }
  .play.off { background: #94a3b8; opacity: .5; }
  .disclosure { font-size: 11px; color: #64748b; background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; line-height: 1.6; }
  .item { padding: 18px 0; border-bottom: 1px dashed var(--line); }
  .item:last-child { border-bottom: none; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .sym-lg { font-size: 22px; font-weight: 900; }
  .muted { font-size: 13px; color: #94a3b8; font-weight: 700; margin-left: 8px; }
  .price { font-size: 20px; font-weight: 800; color: #475569; font-family: ui-monospace, monospace; }
  .pct { background: #334155; color: #f8fafc; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 900; margin-left: 8px; vertical-align: middle; }
  .badge { padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 900; letter-spacing: .5px; border: 1px solid; }
  .b-new { background: #eff6ff; color: #3b82f6; border-color: #bfdbfe; }
  .b-add { background: #f0fdf4; color: #16a34a; border-color: #bbf7d0; }
  .b-reduce { background: #fef2f2; color: #dc2626; border-color: #fecaca; }
  .b-clear { background: #fffbeb; color: #d97706; border-color: #fde68a; }
  .votes { background: #fffbeb; color: #b45309; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; }
  details { margin-top: 10px; }
  details summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; color: #3b82f6; user-select: none; }
  details summary::-webkit-details-marker { display: none; }
  details summary .arrow { display: inline-block; transition: transform .2s; font-size: 10px; }
  details[open] summary .arrow { transform: rotate(90deg); }
  .md { background: #f8fafc; padding: 14px 18px; border-radius: 12px; border: 1px solid var(--line); margin-top: 10px; font-size: 13px; color: #334155; line-height: 1.65; overflow-wrap: anywhere; }
  .md p { margin: 0 0 8px; } .md p:last-child { margin-bottom: 0; } .md ul, .md ol { padding-left: 20px; margin: 0 0 8px; } .md a { color: #2563eb; }
  .md .ai-note { display: block; margin-top: 10px; font-size: 10px; color: #94a3b8; font-weight: 700; }
  .empty { text-align: center; padding: 48px 20px; color: #cbd5e1; font-size: 15px; font-weight: 800; border: 2px dashed #f1f5f9; border-radius: 16px; }
  .skeleton { background: var(--line); animation: pulse 1.5s infinite; border-radius: 8px; }
  .error-card { text-align: center; padding: 40px; border: 1px solid #fecaca; background: #fef2f2; border-radius: 16px; color: #b91c1c; font-size: 14px; font-weight: 900; }
  .footer { background: #f8fafc; padding: 16px 24px calc(16px + var(--safe-bottom)); text-align: center; font-size: 11px; color: #94a3b8; font-weight: 600; border-top: 1px solid #f1f5f9; line-height: 1.6; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
  @media (max-width: 768px) {
    body { background: var(--bg-card); }
    .app { margin: 0; border-radius: 0; border: none; box-shadow: none; min-height: 100dvh; }
    .header { padding: calc(20px + var(--safe-top)) 20px 20px; } .header h1 { font-size: 22px; }
    .section { padding: 20px; } .notice { margin: 12px 20px 0; }
    .sym-lg, .price { font-size: 18px; } .holding { font-size: 14px; padding: 8px 12px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <h1>AI LLM 投資看板</h1>
      <div class="header-sub" id="status">載入最新數據中…</div>
    </div>
    <div class="live stale" id="live"><span class="dot"></span><span id="live-text">LOADING</span></div>
  </div>
  <div id="notice" class="notice" hidden></div>

  <div id="skeleton" class="section">
    <div class="skeleton" style="width:100px;height:16px;margin-bottom:20px"></div>
    <div style="display:flex;gap:10px;margin-bottom:30px"><div class="skeleton" style="width:80px;height:36px"></div><div class="skeleton" style="width:90px;height:36px"></div></div>
    <div class="skeleton" style="width:100%;height:80px;margin-bottom:16px"></div>
    <div class="skeleton" style="width:100%;height:80px"></div>
  </div>

  <div id="content" hidden>
    <div class="section" id="alloc-section" hidden>
      <div class="section-title">📊 組合資產配置（含現金）</div>
      <div class="alloc-bar" id="alloc-bar"></div>
      <div class="legend" id="alloc-legend"></div>
    </div>
    <div class="section section-bg">
      <div class="section-title">💼 當前持倉 <span class="chip" style="background:#e2e8f0;color:#475569">今日漲跌</span></div>
      <div class="holdings" id="holdings"></div>
    </div>
    <div class="section" id="video-section" hidden>
      <div class="section-title" style="color:#b91c1c">🎥 影音精選觀點 <span class="chip" style="background:#fef2f2;color:#ef4444" id="video-window"></span></div>
      <div id="videos"></div>
    </div>
    <div class="section">
      <div class="section-title">📢 最新發布訊號 <span class="chip" style="background:#eff6ff;color:#3b82f6" id="signal-window"></span></div>
      <div class="disclosure" id="disclosure"></div>
      <div id="signals"></div>
    </div>
  </div>

  <div class="footer"><div id="disclaimer"></div><div style="margin-top:6px;color:#cbd5e1">Powered by Quant Matrix Agent</div></div>
</div>

<script>
(function () {
  'use strict';
  // ⚙️ 與 admin.html 使用同一個 Apps Script 部署網址
  const API_URL = 'https://script.google.com/macros/s/AKfycbzRNopoUUFMa_qTGXH3xwnd9zxWTwrqEz5Pvzua2O2d794BmbhbqBBQVHSW-rX-OGA/exec';
  const REFRESH_MS = 5 * 60 * 1000;
  const PALETTE = ['#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#14b8a6', '#f43f5e', '#06b6d4', '#64748b'];
  const TYPE_INFO = { new: ['建倉 NEW', 'b-new'], add: ['加碼 ADD', 'b-add'], buy: ['加碼 ADD', 'b-add'], reduce: ['減碼 REDUCE', 'b-reduce'], sell: ['減碼 REDUCE', 'b-reduce'], clear: ['清倉 CLEAR', 'b-clear'] };

  marked.setOptions({ gfm: true, breaks: true });
  DOMPurify.addHook('afterSanitizeAttributes', function (n) { if (n.tagName === 'A') { n.setAttribute('target', '_blank'); n.setAttribute('rel', 'noopener noreferrer nofollow'); } });
  const md = s => DOMPurify.sanitize(marked.parse(String(s || '')), { FORBID_TAGS: ['style', 'form', 'input', 'img', 'iframe'], FORBID_ATTR: ['style'] });

  const $ = id => document.getElementById(id);
  // 建立 DOM 節點：所有資料一律以 textContent 寫入，不經 innerHTML
  function h(tag, props, children) {
    const el = document.createElement(tag);
    if (props) Object.keys(props).forEach(k => {
      const v = props[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'style') Object.assign(el.style, v);
      else if (k === 'text') el.textContent = v;
      else el.setAttribute(k, v);
    });
    (children || []).forEach(c => { if (c !== null && c !== undefined && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c))); });
    return el;
  }
  const safeHttp = u => (typeof u === 'string' && /^https?:\/\/[^\s"'<>`]+$/i.test(u)) ? u : null;
  const quoteUrl = sym => {
    const i = sym.indexOf(':');
    return i > 0 ? 'https://www.google.com/finance/quote/' + encodeURIComponent(sym.slice(i + 1)) + ':' + encodeURIComponent(sym.slice(0, i))
                 : 'https://finance.yahoo.com/quote/' + encodeURIComponent(sym);
  };
  const fmtPrice = v => (Number(v) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtTime = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }); };

  let lastText = '';
  let lastOkAt = null;

  function renderAllocation(list) {
    const items = (Array.isArray(list) ? list : []).filter(x => Number(x.pct) > 0);
    $('alloc-section').hidden = !items.length;
    let ci = 0;
    const bar = [], legend = [];
    items.forEach(it => {
      const color = it.isCash ? '#10b981' : PALETTE[ci++ % PALETTE.length];
      const pct = Math.max(0, Math.min(100, Number(it.pct) || 0));
      bar.push(h('div', { style: { width: pct + '%', background: color }, title: String(it.name) + '：' + pct + '%' }));
      legend.push(h('div', { class: 'legend-item' }, [h('i', { style: { background: color } }), String(it.name), h('b', { text: pct.toFixed(1) + '%' })]));
    });
    $('alloc-bar').replaceChildren.apply($('alloc-bar'), bar);
    $('alloc-legend').replaceChildren.apply($('alloc-legend'), legend);
  }

  function renderHoldings(list) {
    const box = $('holdings');
    const items = Array.isArray(list) ? list : [];
    if (!items.length) { box.replaceChildren(h('span', { style: { color: '#cbd5e1', fontWeight: 800, fontSize: '14px' }, text: '目前無持倉資料' })); return; }
    box.replaceChildren.apply(box, items.map(it => {
      const sym = String(it.symbol || '');
      const c = it.changePct;
      const ch = (c === null || c === undefined || !isFinite(c))
        ? h('small', { class: 'flat', text: '—' })
        : h('small', { class: c > 0 ? 'up' : c < 0 ? 'down' : 'flat', text: (c >= 0 ? '▲' : '▼') + Math.abs(c).toFixed(2) + '%' });
      return h('a', { class: 'holding', href: quoteUrl(sym), target: '_blank', rel: 'noopener noreferrer' }, [sym, ch]);
    }));
  }

  function renderVideos(list, days) {
    const items = Array.isArray(list) ? list : [];
    $('video-section').hidden = !items.length;
    $('video-window').textContent = '近 ' + days + ' 日';
    $('videos').replaceChildren.apply($('videos'), items.map(v => {
      const url = safeHttp(v.url);
      const btn = url ? h('a', { class: 'play', href: url, target: '_blank', rel: 'noopener noreferrer' }, ['▶ 觀看解析']) : h('span', { class: 'play off', text: '未附連結' });
      return h('div', { class: 'video' }, [h('div', null, [h('div', { class: 'sym', text: v.symbol }), h('div', { class: 'date', text: v.date })]), btn]);
    }));
  }

  function renderSignals(list, days, openKeys, aiModel) {
    const box = $('signals');
    $('signal-window').textContent = '近 ' + days + ' 日';
    const items = Array.isArray(list) ? list : [];
    if (!items.length) { box.replaceChildren(h('div', { class: 'empty', text: '近 ' + days + ' 日無新訊號' })); return; }
    box.replaceChildren.apply(box, items.map(it => {
      const key = [it.date, it.symbol, it.type, it.price].join('|');
      const info = TYPE_INFO[String(it.type || '').toLowerCase()] || [String(it.type || '訊號'), 'b-new'];
      const pctNode = Number(it.positionPct) > 0 ? h('span', { class: 'pct', text: Number(it.positionPct) + '%' }) : null;
      const children = [
        h('div', { class: 'row' }, [h('div', null, [h('span', { class: 'sym-lg', text: it.symbol }), pctNode, h('span', { class: 'muted', text: it.date })]), h('span', { class: 'badge ' + info[1], text: info[0] })]),
        h('div', { class: 'row' }, [h('span', { class: 'price', text: Number(it.price) > 0 ? '$' + fmtPrice(it.price) : '—' }), h('span', { class: 'votes', text: '票數 ' + (Number(it.votes) || 0) })])
      ];
      if (it.analysis && String(it.analysis).trim()) {
        const body = h('div', { class: 'md' });
        body.innerHTML = md(it.analysis);  // 已經過 DOMPurify 消毒
        body.append(h('span', { class: 'ai-note', text: '內容可能由 AI（' + aiModel + '）生成，僅供參考。' }));
        const det = h('details', { 'data-key': key }, [h('summary', null, [h('span', { class: 'arrow', text: '▶' }), '深入解析與戰略邏輯']), body]);
        if (openKeys.has(key)) det.open = true;
        children.push(det);
      }
      return h('div', { class: 'item' }, children);
    }));
  }

  function render(json) {
    const openKeys = new Set(Array.from(document.querySelectorAll('#signals details[open]')).map(d => d.getAttribute('data-key')));
    const rules = json.rules || { windowDays: 7 };
    $('skeleton').hidden = true;
    $('content').hidden = false;
    renderAllocation(json.allocation);
    renderHoldings(json.holdings);
    renderVideos(json.videos, rules.windowDays);
    $('disclosure').textContent = json.disclosure || '';
    renderSignals(json.signals, rules.windowDays, openKeys, json.aiModel || 'AI');
    $('disclaimer').textContent = json.disclaimer || '';
  }

  function setLive(ok) {
    $('live').classList.toggle('stale', !ok);
    $('live-text').textContent = ok ? 'LIVE' : '延遲';
  }

  async function load() {
    try {
      if (API_URL.indexOf('REPLACE_WITH') >= 0) throw new Error('setup');
      const res = await fetch(API_URL + '?action=public_board', { cache: 'no-store' });
      if (!res.ok) throw new Error('http');
      const text = await res.text();
      const json = JSON.parse(text);
      if (json.status !== 'success') throw new Error('backend');
      lastOkAt = Date.now();
      if (text !== lastText) { render(json); lastText = text; }
      $('status').textContent = '資料時間 ' + fmtTime(json.generatedAt);
      $('notice').hidden = true;
      setLive(true);
    } catch (e) {
      setLive(false);
      if (!lastText) {
        $('status').textContent = '暫時無法載入';
        $('skeleton').replaceChildren(h('div', { class: 'error-card', text: '資料暫時無法載入，請稍後重新整理。' }));
      } else {
        $('notice').hidden = false;
        $('notice').textContent = '⚠️ 最新資料更新失敗，目前顯示的是 ' + new Date(lastOkAt).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }) + ' 取得的內容。';
      }
    }
  }

  load();
  setInterval(load, REFRESH_MS);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && (!lastOkAt || Date.now() - lastOkAt > REFRESH_MS)) load(); });
})();
</script>
</body>
</html>
